services:
  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb
    networks:
      - custom-net
    restart: on-failure
    env_file: .env
    secrets:
      - db_password
      - db_root_password
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    container_name: wordpress
    env_file: .env
    build: ./requirements/wordpress
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    networks:
      - custom-net
    restart: on-failure
    volumes:
      - wp_data:/var/www/html

  nginx:
    container_name: nginx
    env_file: .env
    build: ./requirements/nginx
    networks:
      - custom-net
    restart: on-failure

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt

networks:
  custom-net:

volumes:
  db_data:
  wp_data:
